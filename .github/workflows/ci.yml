name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit-message scan needs the whole PR or push range

      - uses: astral-sh/setup-uv@v6

      - name: CLI tests (incl. version parity and skill conventions)
        working-directory: cli
        run: uv run --frozen pytest -q

      - name: Structural leak check
        working-directory: cli
        run: uv run --frozen python -m solstice leakscan tree ..

      # Secret patterns only; the denylist stays private. A zero or unknown
      # base (new branch, force-push) widens the scan to all of head's history.
      - name: Commit-message secret scan
        working-directory: cli
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: uv run --frozen python -m solstice leakscan commits "$BASE_SHA..$HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
