# Keys the solstice adapters read. Key NAMES only: this file never holds a
# value. Set each key in your own environment (any secrets manager, or a plain
# `export`); the CLI reads the process environment and nothing else. There are
# no default or shared keys. A missing key leaves its source unavailable, and
# Find runs on the keyless sources below.
keyless_sources:
  - WordPress.org
  - Hacker News

secrets:
  - key: DATAFORSEO_LOGIN
    adapter: dataforseo
    name: DataForSEO
    used_for: demand (trends and keyword volume)
  - key: DATAFORSEO_PASSWORD
    adapter: dataforseo
    name: DataForSEO
    used_for: demand (trends and keyword volume)
  - key: TRUSTMRR_API_KEY
    adapter: trustmrr
    name: TrustMRR
    used_for: demand (revenue of comparable products)
  - key: SCRAPECREATORS_API_KEY
    adapter: scrapecreators
    name: ScrapeCreators
    used_for: demand (Reddit, TikTok, YouTube search; X account lookups)
  - key: FREEMIUS_PUBLIC_KEY
    adapter: freemius
    name: Freemius
    used_for: revenue (read-only)
  - key: FREEMIUS_SECRET_KEY
    adapter: freemius
    name: Freemius
    used_for: revenue (read-only)
  - key: POLAR_ACCESS_TOKEN
    adapter: polar
    name: Polar
    used_for: revenue (read-only scopes)
