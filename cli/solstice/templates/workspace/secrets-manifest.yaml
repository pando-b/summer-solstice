# Secrets the solstice adapters read. Key NAMES only - values live in Infisical
# and are injected per command, e.g. `infisical run -- solstice <command>`, so
# the agent session's own environment never holds them.
#
# With none of these set, Find runs in keyless mode on the sources below.
keyless_sources:
  - WordPress.org
  - Hacker News

secrets:
  - key: DATAFORSEO_LOGIN
    adapter: dataforseo
    name: DataForSEO
    used_for: demand (trends and keyword volume)
  - key: DATAFORSEO_PASSWORD
    adapter: dataforseo
    name: DataForSEO
    used_for: demand (trends and keyword volume)
  - key: APIFY_TOKEN
    adapter: apify
    name: Apify
    used_for: demand (marketplace scrapes on shortlisted candidates)
  - key: TRUSTMRR_API_KEY
    adapter: trustmrr
    name: TrustMRR
    used_for: demand (revenue of comparable products)
  - key: FREEMIUS_PUBLIC_KEY
    adapter: freemius
    name: Freemius
    used_for: revenue (read-only)
  - key: FREEMIUS_SECRET_KEY
    adapter: freemius
    name: Freemius
    used_for: revenue (read-only)
  - key: POLAR_ACCESS_TOKEN
    adapter: polar
    name: Polar
    used_for: revenue (read-only scopes)
